name: Sync user manual to GitHub Wiki

on:
  # Keep the online copy aligned with the manual under source control.
  push:
    branches: [main]
    paths:
      - 'handoff/manual/**'
      - 'scripts/build_wiki.py'
      - '.github/workflows/sync-wiki.yml'
  # The first page must be created in the GitHub Wiki UI. That creates the
  # separate wiki Git repository, and this event publishes all chapters.
  gollum:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handoff-wiki-sync
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'SimonHeggie/HandOff' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out HandOff source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install wiki converter
        run: python -m pip install beautifulsoup4==4.14.3 markdownify==1.2.2
      - name: Generate wiki pages from the existing manual
        run: python scripts/build_wiki.py --source handoff/manual --output .wiki-build
      - name: Check whether the wiki exists
        id: wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::The Wiki has not been initialized. Create its first page at https://github.com/SimonHeggie/HandOff/wiki. A gollum event will trigger the automatic sync.'
          fi
      - name: Publish generated chapters without touching custom wiki pages
        if: steps.wiki.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" .wiki-checkout
          for path in .wiki-build/*.md; do
            cp "$path" ".wiki-checkout/$(basename "$path")"
          done
          cd .wiki-checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only stage pages generated by HandOff; preserve other wiki pages.
          for path in ../.wiki-build/*.md; do
            git add -- "$(basename "$path")"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Sync HandOff user manual from main'
            git push --quiet origin HEAD
          else
            echo 'Wiki pages already match the source manual.'
          fi