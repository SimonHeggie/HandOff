name: Sync HandOff v0.7.53 release notes

on:
  push:
    branches: [main]
    paths:
      - 'docs/RELEASE_NOTES_v0.7.53-alpha.1.md'
      - '.github/workflows/sync-v0.7.53-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-notes:
    if: github.repository == 'SimonHeggie/HandOff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.7.53-alpha.1
    steps:
      - uses: actions/checkout@v4
      - name: Update published release description from source notes
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/RELEASE_NOTES_v0.7.53-alpha.1.md
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            grep -Fx 'HandOff-v0.7.53-alpha.1-blender-addon.zip'
          gh release edit "$TAG" --notes-file docs/RELEASE_NOTES_v0.7.53-alpha.1.md
          gh release view "$TAG" --json body --jq '.body' > published-notes.md
          python - <<'PY'
          from pathlib import Path
          source = Path('docs/RELEASE_NOTES_v0.7.53-alpha.1.md').read_text().rstrip()
          published = Path('published-notes.md').read_text().rstrip()
          assert source == published, 'Published release notes do not match the repository source'
          print('Published release notes match the repository source')
          PY
