name: Publish first Handoff alpha

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-first-alpha.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the committed source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download and verify pinned Pillow wheels
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path("docs/pillow-wheels.json").read_text(encoding="utf-8"))
          with urllib.request.urlopen("https://pypi.org/pypi/pillow/12.0.0/json", timeout=30) as response:
              release = json.load(response)
          wheels = {item["filename"]: item for item in release["urls"]}
          destination = Path(".release-wheels")
          destination.mkdir(exist_ok=True)

          for row in manifest:
              name = row["filename"]
              item = wheels.get(name)
              if not item:
                  raise RuntimeError(f"Pillow release is missing expected wheel: {name}")
              if item["digests"]["sha256"] != row["sha256"]:
                  raise RuntimeError(f"Upstream wheel digest mismatch: {name}")
              with urllib.request.urlopen(item["url"], timeout=90) as response:
                  data = response.read()
              if len(data) != row["bytes"] or hashlib.sha256(data).hexdigest() != row["sha256"]:
                  raise RuntimeError(f"Downloaded wheel failed manifest verification: {name}")
              (destination / name).write_bytes(data)
              print(f"Verified {name}")
          PY
      - name: Validate Python source syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          count = 0
          for path in Path("blend_psd_tools").rglob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              count += 1
          print(f"Validated {count} Python files")
          PY
      - name: Build the installable ZIP
        run: |
          python scripts/build_install_zip.py --wheels-from .release-wheels --output dist/HandOff-v0.7.50-alpha.1-blender-addon.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path = Path("dist/HandOff-v0.7.50-alpha.1-blender-addon.zip")
          with ZipFile(path) as z:
              corrupt = z.testzip()
              if corrupt:
                  raise RuntimeError(f"Corrupt ZIP entry: {corrupt}")
              assert "blend_psd_tools/__init__.py" in z.namelist()
              wheels = [name for name in z.namelist() if name.endswith(".whl")]
              assert len(wheels) == 6, f"Expected 6 Pillow wheels, got {len(wheels)}"
          print(f"Release ZIP: {path.stat().st_size:,} bytes")
          PY
      - name: Generate checksum
        run: |
          cd dist
          sha256sum HandOff-v0.7.50-alpha.1-blender-addon.zip > SHA256SUMS.txt
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.50-alpha.1 \
            dist/HandOff-v0.7.50-alpha.1-blender-addon.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Handoff v0.7.50 Alpha 1 (Comp-IO source)" \
            --notes-file docs/FIRST_RELEASE_NOTES.md \
            --prerelease
