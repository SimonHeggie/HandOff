name: Publish HandOff v0.7.53 Alpha 1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.7.53-alpha.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handoff-release-v0.7.53-alpha.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'SimonHeggie/HandOff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: v0.7.53-alpha.1
      ASSET: HandOff-v0.7.53-alpha.1-blender-addon.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify release version and complete OCA source
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          brand=Path('handoff/branding.py').read_text()
          assert 'VERSION_INFO = (0, 7, 53)' in brand
          init=Path('handoff/__init__.py').read_text()
          assert "'version': (0, 7, 53)" in init
          for name in ('oca_project.py','oca_authoring.py','oca_vectors.py','oca_validation.py','oca_references.py'):
              assert (Path('handoff')/name).is_file(),name
          for path in Path('handoff').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'),filename=str(path))
          assert Path('docs/RELEASE_NOTES_v0.7.53-alpha.1.md').is_file()
          print('Verified version, OCA source and Python syntax')
          PY

      - name: Install test and font conversion dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow==12.0.0 attrs scipy fonttools

      - name: Download exactly six pinned Pillow wheels with SHA256 verification
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          manifest=json.loads(Path('docs/pillow-wheels.json').read_text())
          assert len(manifest)==6
          with urllib.request.urlopen('https://pypi.org/pypi/pillow/12.0.0/json',timeout=30) as r:
              available={p['filename']:p for p in json.load(r)['urls']}
          target=Path('.release-wheels')
          target.mkdir(exist_ok=True)
          for row in manifest:
              name=row['filename']
              info=available[name]
              assert info['digests']['sha256']==row['sha256']
              with urllib.request.urlopen(info['url'],timeout=90) as r:
                  data=r.read()
              assert len(data)==row['bytes']
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              (target/name).write_bytes(data)
              print('Verified',name)
          PY
          mkdir -p handoff/pillow
          cp .release-wheels/*.whl handoff/pillow/

      - name: Rebuild Blender Bfont companion with pinned source and output hashes
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          info=json.loads(Path('handoff/vendor/fonts/Bfont-Regular.json').read_text())
          url='https://raw.githubusercontent.com/blender/blender/main/release/datafiles/bfont.pfb'
          with urllib.request.urlopen(url,timeout=40) as r:
              data=r.read()
          assert hashlib.sha256(data).hexdigest()==info['source_sha256']
          Path('.release-wheels/bfont.pfb').write_bytes(data)
          PY
          python handoff/development/build_bfont_otf.py .release-wheels/bfont.pfb handoff/vendor/fonts/Bfont-Regular.otf
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('handoff/vendor/fonts/Bfont-Regular.otf')
          expected=json.loads(Path('handoff/vendor/fonts/Bfont-Regular.json').read_text())['otf_sha256']
          assert hashlib.sha256(path.read_bytes()).hexdigest()==expected
          print('Verified Bfont OpenType/CFF companion')
          PY

      - name: Run complete Blender-independent regression suite
        env:
          PYTHONPATH: handoff:handoff/vendor
        run: python -m unittest discover -q -s handoff -p 'test_*.py'

      - name: Package and test the real Blender install ZIP
        run: |
          python scripts/build_install_zip.py --wheels-from .release-wheels --output "dist/${ASSET}"
          python scripts/verify_install_zip.py "dist/${ASSET}"
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os
          target=Path('dist')/os.environ['ASSET']
          assert target.stat().st_size>25_000_000
          with ZipFile(target) as z:
              assert z.testzip() is None
              files=set(z.namelist())
              for name in ('handoff/__init__.py','handoff/oca_project.py','handoff/oca_authoring.py','handoff/oca_vectors.py','handoff/oca_validation.py','handoff/vendor/fonts/Bfont-Regular.otf'):
                  assert name in files,name
              assert sum(n.endswith('.whl') for n in files)==6
          print('Validated full v0.7.53 installable Blender add-on ZIP')
          PY
          (cd dist && sha256sum "${ASSET}" > SHA256SUMS.txt)

      - name: Publish verified alpha release with installable ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create "$TAG" "dist/${ASSET}" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "HandOff v0.7.53 Alpha 1 — OCA 1.3 Interchange" \
            --notes-file docs/RELEASE_NOTES_v0.7.53-alpha.1.md \
            --prerelease
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'SHA256SUMS.txt'
