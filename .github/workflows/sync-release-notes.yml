name: Verify preserved release history

on:
  push:
    branches: [main]
    paths:
      - "docs/HISTORICAL_GITHUB_RELEASE_NOTES.md"
      - "docs/FIRST_RELEASE_NOTES.md"
      - "docs/RELEASE_NOTES_v0.7.51-alpha.1.md"
      - ".github/workflows/sync-release-notes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm historical notes are retained
        run: |
          set -euo pipefail
          test -s docs/FIRST_RELEASE_NOTES.md
          test -s docs/RELEASE_NOTES_v0.7.51-alpha.1.md
          grep -Fq 'v0.7.50-alpha.1' docs/HISTORICAL_GITHUB_RELEASE_NOTES.md
          grep -Fq 'v0.7.51-alpha.1' docs/HISTORICAL_GITHUB_RELEASE_NOTES.md
          echo 'Original public release notes remain available in the repository.'
